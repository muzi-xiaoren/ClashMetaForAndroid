name: Sync Upstream

# Keep this fork current with MetaCubeX/ClashMetaForAndroid. Our WebDAV-sync
# commits sit on top of upstream and are preserved by the merge. If upstream
# ever edits the same lines we did, the merge step fails loudly.
#
# Code is synced on every run, but a release is only published when upstream
# actually ships a new version (versionName changes) — not for every commit,
# so routine dependency bumps don't spam releases.
#
# Merge, build and release all run in one job on purpose: the build happens in
# the same working tree we just merged, so we never build a pre-merge commit.
#
# Every run (success or failure) ends by overwriting .github/sync-status.md with
# a commit. Besides being a run log, this keeps the repository active: GitHub
# disables scheduled workflows in public repos after 60 days with no activity.
on:
  schedule:
    # 1st of each month, 18:00 UTC
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  SyncAndRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "muzi-xiaoren"
          git config user.email "106290465+muzi-xiaoren@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git || true
          git fetch upstream

          read_version() {
            grep -oE 'versionName = "[^"]+"' build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/'
          }

          BEFORE=$(git rev-parse HEAD)
          VERSION_BEFORE=$(read_version)
          echo "version_before=$VERSION_BEFORE" >> $GITHUB_OUTPUT
          echo "upstream=$(git rev-parse --short upstream/main)" >> $GITHUB_OUTPUT

          git merge upstream/main --no-edit

          AFTER=$(git rev-parse HEAD)
          VERSION_AFTER=$(read_version)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Merged new upstream commits."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          if [ "$VERSION_BEFORE" != "$VERSION_AFTER" ]; then
            echo "Upstream shipped a new version: $VERSION_BEFORE -> $VERSION_AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged ($VERSION_AFTER) - syncing code only, no release."
            echo "released=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION_AFTER" >> $GITHUB_OUTPUT

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # ---- only when upstream actually released a new version ----

      - name: Checkout submodules
        if: steps.merge.outputs.released == 'true'
        run: git submodule update --init --recursive --force

      - name: Setup Java
        if: steps.merge.outputs.released == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        if: steps.merge.outputs.released == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        if: steps.merge.outputs.released == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        if: steps.merge.outputs.released == 'true'
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Update CA
        if: steps.merge.outputs.released == 'true'
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build
        if: steps.merge.outputs.released == 'true'
        run: ./gradlew --no-daemon app:assembleAlphaRelease
        env:
          RELEASE_TAG: v${{ steps.merge.outputs.version }}-webdav

      - name: Publish Release
        if: steps.merge.outputs.released == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.merge.outputs.version }}-webdav
          name: v${{ steps.merge.outputs.version }} (WebDAV sync)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Synced with upstream **v${{ steps.merge.outputs.version }}**, with the WebDAV cloud sync feature on top.

            Install the APK matching your phone's ABI (most modern phones: `arm64-v8a`; if unsure use `universal`).
          files: |
            app/build/outputs/apk/alpha/release/*.apk

      # ---- always: record this run and keep the repository active ----

      - name: Commit run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          CHANGED: ${{ steps.merge.outputs.changed }}
          RELEASED: ${{ steps.merge.outputs.released }}
          VERSION_BEFORE: ${{ steps.merge.outputs.version_before }}
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          # Commit the status on top of whatever main is now, on a clean tree: a conflicting
          # merge leaves the tree mid-merge, and a successful merge has already been pushed.
          # (Throwaway runner checkout, so resetting loses nothing.)
          git merge --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main

          case "$CHANGED" in
            true)  SYNC="已合并新的上游提交" ;;
            false) SYNC="已是最新，无新提交" ;;
            *)     SYNC="未完成（合并失败，请查看运行详情）" ;;
          esac
          case "$RELEASED" in
            true)  RELEASE="v${VERSION}-webdav" ;;
            false) RELEASE="版本未变，未发布" ;;
            *)     RELEASE="未发布" ;;
          esac
          if [ "$RELEASED" = "true" ] && [ "$JOB_STATUS" != "success" ]; then
            RELEASE="v${VERSION}-webdav 构建或发布失败"
          fi

          {
            echo "# 上游同步运行记录"
            echo
            echo "> 本文件由 Sync Upstream workflow 每次运行时自动覆盖。"
            echo "> 每次运行都会提交一次，让仓库保持活跃，避免 GitHub 在 60 天无活动后停用定时任务。"
            echo
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 触发方式：${EVENT}"
            echo "- 运行结果：${JOB_STATUS}"
            echo "- 上游 HEAD：MetaCubeX/ClashMetaForAndroid@${UPSTREAM:-未知}"
            echo "- 代码同步：${SYNC}"
            echo "- 版本：${VERSION_BEFORE:-未知} → ${VERSION:-未知}"
            echo "- 发布：${RELEASE}"
            echo "- 运行详情：${RUN_URL}"
          } > .github/sync-status.md

          git add .github/sync-status.md
          git commit -m "chore: record upstream sync run ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
