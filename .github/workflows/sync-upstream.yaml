name: Sync Upstream

# Keep this fork current with MetaCubeX/ClashMetaForAndroid and publish our own
# release whenever upstream moves. Our WebDAV-sync commits sit on top of upstream
# and are preserved by the merge. If upstream ever edits the same lines we did,
# the merge step fails loudly so it can be resolved by hand.
#
# Everything runs in one job on purpose: the build happens in the same working
# tree we just merged, so there is no risk of building a pre-merge commit.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  SyncAndRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "muzi-xiaoren"
          git config user.email "106290465+muzi-xiaoren@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git || true
          git fetch upstream
          BEFORE=$(git rev-parse HEAD)
          git merge upstream/main --no-edit
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Merged new upstream commits."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          VERSION=$(grep -oE 'versionName = "[^"]+"' build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # ---- build the synced code and publish it as our own release ----

      - name: Checkout submodules
        if: steps.merge.outputs.changed == 'true'
        run: git submodule update --init --recursive --force

      - name: Setup Java
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        if: steps.merge.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        if: steps.merge.outputs.changed == 'true'
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Update CA
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build
        if: steps.merge.outputs.changed == 'true'
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Publish Release
        if: steps.merge.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.merge.outputs.version }}-webdav
          name: v${{ steps.merge.outputs.version }} (WebDAV sync)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Synced with upstream **v${{ steps.merge.outputs.version }}**, with the WebDAV cloud sync feature on top.

            Install the APK matching your phone's ABI (most modern phones: `arm64-v8a`; if unsure use `universal`).
          files: |
            app/build/outputs/apk/alpha/release/*.apk
